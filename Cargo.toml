[workspace]
members = ["crates/core", "crates/app"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.98.0"
authors = ["Softhe"]
license = "GPL-3.0-only"
repository = "https://github.com/Softhe/CS2-ResEdit"
homepage = "https://github.com/Softhe/CS2-ResEdit"

[workspace.dependencies]
chrono = { version = "0.4", features = ["clock"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
