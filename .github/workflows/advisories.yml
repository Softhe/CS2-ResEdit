name: advisories

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly dependency review; failures file issues via checked-in deny.toml
    # exception policy rather than silently passing.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Select Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.0

      - name: Install cargo-deny
        # Pinned to the version recorded in deny.toml.
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check advisories, bans, sources, and licenses
        run: cargo deny --locked check advisories bans sources licenses
