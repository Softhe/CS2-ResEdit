name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Restore canonical repository line endings
        shell: pwsh
        run: git -c core.autocrlf=false checkout-index --force --all

      - name: Validate tag and source version
        shell: pwsh
        run: |
          .\build\Test-ReleaseMetadata.ps1 `
            -Tag $env:GITHUB_REF_NAME `
            -RefType $env:GITHUB_REF_TYPE

      - name: Build deterministic release assets
        shell: powershell
        run: |
          .\build\Build-Release.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v') -OutputDirectory .\dist

      - name: Reproduce release assets with PowerShell 7
        shell: pwsh
        run: |
          ./build/Build-Release.ps1 `
            -Version $env:GITHUB_REF_NAME.TrimStart('v') `
            -OutputDirectory ./repeat-pwsh
          $releaseHash = (Get-FileHash ./dist/CS2-VideoConfig-Editor.zip -Algorithm SHA256).Hash
          $repeatHash = (Get-FileHash ./repeat-pwsh/CS2-VideoConfig-Editor.zip -Algorithm SHA256).Hash
          if ($releaseHash -ne $repeatHash) {
            throw 'Release build differs between Windows PowerShell 5.1 and PowerShell 7.'
          }

      - name: Verify packaged runtime with Windows PowerShell 5.1
        shell: powershell
        env:
          REQUIRE_AUTHENTICODE_SIGNATURE: ${{ vars.REQUIRE_AUTHENTICODE_SIGNATURE }}
        run: |
          Expand-Archive .\dist\CS2-VideoConfig-Editor.zip .\package-check
          Get-ChildItem .\package-check -Recurse -File |
            Where-Object { $_.Extension -in @('.ps1', '.psm1', '.psd1') } |
            ForEach-Object {
              $tokens = $null
              $errors = $null
              [void][Management.Automation.Language.Parser]::ParseFile(
                $_.FullName,
                [ref]$tokens,
                [ref]$errors
              )
              if ($errors.Count) { throw ($errors -join [Environment]::NewLine) }
            }
          . .\package-check\CS2-VideoConfig-Editor.ps1
          if ($script:ApplicationVersion -ne $env:GITHUB_REF_NAME.TrimStart('v')) {
            throw 'Extracted release package failed its launcher smoke test.'
          }
          $verification = @{ ArtifactDirectory = '.\dist' }
          if ($env:REQUIRE_AUTHENTICODE_SIGNATURE -eq 'true') {
            $verification.RequireAuthenticodeSignature = $true
          }
          .\build\Test-ReleaseArtifacts.ps1 @verification

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            ./dist/CS2-VideoConfig-Editor.zip `
            ./dist/CS2-VideoConfig-Editor.zip.sha256 `
            --title "CS2 Video Config Editor $env:GITHUB_REF_NAME" `
            --notes-file ./RELEASE_NOTES.md `
            --verify-tag
