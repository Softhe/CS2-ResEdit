name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Rust for version validation
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy

      - name: Validate tag version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages `
            | Where-Object { $_.name -eq 'cs2_resedit' } | Select-Object -ExpandProperty version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag '$env:GITHUB_REF_NAME' does not match application version '$version'."
          }
          $heading = Get-Content ./RELEASE_NOTES.md -TotalCount 1
          if ($heading -ne "# CS2 ResEdit $env:GITHUB_REF_NAME") {
            throw "Release notes heading must be '# CS2 ResEdit $env:GITHUB_REF_NAME'."
          }
          if ($heading -match '(?i)\(draft\)\s*$') {
            throw 'The release notes heading is still marked as draft. Finalize it before publishing.'
          }

      - name: Download tested release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cs2-resedit-${{ github.sha }}
          path: ./dist

      - name: Verify downloaded asset checksum
        shell: pwsh
        run: |
          $expected = (Get-Content ./dist/CS2-ResEdit.exe.sha256 -Raw).Split()[0]
          $actual = (Get-FileHash ./dist/CS2-ResEdit.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Tested release asset checksum mismatch.' }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            ./dist/CS2-ResEdit.exe `
            ./dist/CS2-ResEdit.exe.sha256 `
            --title "CS2 ResEdit $env:GITHUB_REF_NAME" `
            --notes-file ./RELEASE_NOTES.md `
            --verify-tag
