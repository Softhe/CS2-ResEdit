name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.302

      - name: Validate tag version
        shell: pwsh
        run: |
          $version = (dotnet msbuild src/CS2ResEdit.Editor/CS2ResEdit.Editor.csproj -getProperty:Version).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag '$env:GITHUB_REF_NAME' does not match application version '$version'."
          }

      - name: Build release assets
        shell: pwsh
        run: ./build/Publish.ps1 -OutputDirectory ./dist

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            ./dist/CS2-ResEdit.exe `
            ./dist/CS2-ResEdit.exe.sha256 `
            --title "CS2 ResEdit $env:GITHUB_REF_NAME" `
            --notes-file ./RELEASE_NOTES.md `
            --verify-tag
