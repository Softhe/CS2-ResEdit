name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Publish binary
        shell: pwsh
        run: ./build/Publish.ps1 -SkipTests -OutputDirectory ./dist

      - name: Smoke-test packaged GUI
        shell: pwsh
        env:
          CS2_RESEDIT_SETTINGS_PATH: ${{ runner.temp }}\cs2-resedit-smoke-settings.json
        run: |
          $stderr = Join-Path $env:RUNNER_TEMP 'cs2-resedit-smoke-stderr.txt'
          $process = Start-Process ./dist/CS2-ResEdit.exe -PassThru -RedirectStandardError $stderr
          $second = $null
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 250
              $process.Refresh()
            } until ($process.HasExited -or $process.MainWindowHandle -ne 0 -or [DateTime]::UtcNow -ge $deadline)
            if ($process.HasExited) {
              if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr }
              throw "Packaged application exited with code $($process.ExitCode)."
            }
            if ($process.MainWindowHandle -eq 0) { throw 'Packaged application did not create its main window.' }
            $second = Start-Process ./dist/CS2-ResEdit.exe -PassThru
            $deadline = [DateTime]::UtcNow.AddSeconds(10)
            do {
              Start-Sleep -Milliseconds 250
              $second.Refresh()
            } until ($second.HasExited -or $second.MainWindowHandle -ne 0 -or [DateTime]::UtcNow -ge $deadline)
            if ($second.MainWindowTitle -ne 'CS2 ResEdit is already running') {
              throw 'A second application instance did not show the single-instance notice.'
            }
          } finally {
            if ($second -and -not $second.HasExited) { Stop-Process -Id $second.Id -Force }
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Upload release candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cs2-resedit-${{ github.sha }}
          path: |
            dist/CS2-ResEdit.exe
            dist/CS2-ResEdit.exe.sha256
          if-no-files-found: error
          retention-days: 7

  # Cross-platform guard: exercises the non-Windows code paths (fsutil
  # rename/fd-fsync, cfg(not(windows)) stubs) so regressions surface in CI
  # instead of only in local development.
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
